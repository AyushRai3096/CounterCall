<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CounterCall</title>
  <meta name="theme-color" content="#c0392b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>CounterCall</h1>
    <span id="connection-dot" class="dot dot-offline" title="Relay connection"></span>
  </header>

  <main>
    <section class="card">
      <h2>Order</h2>
      <label class="field">
        <span>Restaurant</span>
        <select id="restaurant-select"></select>
      </label>

      <label class="field">
        <span>Order No</span>
        <input id="order-number" type="text" placeholder="Order number" autocomplete="off" />
      </label>
    </section>

    <section class="card">
      <h2>Items</h2>
      <label class="field">
        <span>Item</span>
        <input id="item-search" type="text" placeholder="Type to search menu…" autocomplete="off" />
        <div id="item-results" class="dropdown-results" hidden></div>
      </label>

      <div class="field-row">
        <div class="field">
          <span>Size</span>
          <div id="size-options" class="toggle-group" role="radiogroup" aria-label="Size"></div>
        </div>

        <div class="field">
          <span>Qty</span>
          <div class="stepper">
            <button type="button" id="qty-minus" aria-label="Decrease quantity">&minus;</button>
            <span id="qty-value">1</span>
            <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
          </div>
        </div>
      </div>

      <label class="field">
        <span>Note for this item</span>
        <input id="item-note" type="text" placeholder="Optional…" />
      </label>

      <button type="button" id="add-item-btn" class="btn btn-secondary" disabled>Add item</button>
    </section>

    <section class="card">
      <h2>This order</h2>
      <ul id="cart-list" class="cart-list">
        <li class="empty-hint">No items added yet.</li>
      </ul>
      <button type="button" id="submit-order-btn" class="btn btn-primary" disabled>Send order</button>
    </section>

    <section class="card">
      <h2>Sent orders</h2>
      <ul id="orders-list" class="orders-list">
        <li class="empty-hint">Nothing sent yet.</li>
      </ul>
    </section>
  </main>

  <script src="vendor/socket.io.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
